<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore The Kashmir</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <img src="chinar.jpg" alt="sorry" height="150" width="500">
    </div>
    <header>
        <div>
            <h1>KASHMIR</h1>
        </div>
        <div>
            <nav>
                <a href="log in.html">Login</a>
                <a href="sign up.html">sign up</a>
            </nav>

        </div>
    </header>
    <main>
        <img src="https://media.istockphoto.com/id/2189784368/photo/snowfall-in-gulmarg-kashmir.jpg?s=1024x1024&w=is&k=20&c=LGtuyyKKLS7ImrWyyoaSWkrzSGSqSKg5Lfvvx1lHhQ8="
            alt="sorry" height="150" width="500">
        <div>
            <b>This is Gulmarg , known for its buitifull gondola ride , skiing and buitifull views. </b>
        </div>
        <div>please fill up the form to book your dream vaccation trip to
            <b>Gulmarg.</b>
        </div>
        <form>
            <div><label for="name">Name</label>
                <input id="name" type="text" placeholder="enter your name">
            </div>
            <div>
                <label for="phone">phone number</label>
                <input id="phone" type="tel" placeholder="enter your phone no.">
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="enter your email">
            </div>
            <div>
                <label for="address">Adress</label>
                <input id="address" type="text" placeholder="enter your address">
            </div>
            <h4>choose your pack</h4>
            <div>
                <input id="Basic" type="radio" name="subscription">
                <label for="basic">Basic</label>
            </div>
            <div>
                <input id="primium" type="radio" name="subscription">
                <label for="premium">Premium</label>
            </div>
            <div>
                <input id="VIP" type="radio" name="subscription">
                <label for="VIP">VIP</label>
            </div>
            <div>
                <button type="submit">SUBMIT</button>
            </div>
        </form>
    </main>
    <footer>
        <b>thank you for visiting,</b>
        if you have any feedback please feel free to share
        <div>
            <label for="feedback">feedback</label>
            <textarea id="feedback" placeholder="enter your feedback......"></textarea>
        </div>
    </footer>
</body>

</html>
